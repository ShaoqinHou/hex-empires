name: Source snapshot

on:
  push:
    branches: [agent/project-takeover]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/hex-empires-source.tar.gz
          git ls-files > /tmp/tracked-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: |
            /tmp/hex-empires-source.tar.gz
            /tmp/tracked-files.txt
          retention-days: 2
